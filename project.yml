name: MotorsportIQ
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1
targets:
  MotorsportIQ:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MotorsportIQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.shuknuk.MotorsportIQ
        PRODUCT_NAME: Motorsport IQ
        PRODUCT_MODULE_NAME: MotorsportIQ
        SOCKET_URL: http://localhost:4000
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MotorsportIQ/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Motorsport IQ
        INFOPLIST_KEY_SOCKET_URL: "$(SOCKET_URL)"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_UILaunchScreen_Generation: true
    dependencies:
      - package: SocketIO
        product: SocketIO
    scheme:
      testTargets:
        - MotorsportIQTests
        - MotorsportIQUITests
  MotorsportIQTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MotorsportIQTests
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Motorsport IQ.app/Motorsport IQ"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: MotorsportIQ
  MotorsportIQUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MotorsportIQUITests
    dependencies:
      - target: MotorsportIQ
